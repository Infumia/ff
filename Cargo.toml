[package]
name = "ff"
version = "0.1.0"
edition = "2021"
description = "Tiny interactive fuzzy finder for file names and file contents"
license = "MIT"

[[bin]]
name = "ff"
path = "src/main.rs"

[dependencies]
# The terminal UI: layout and drawing, over crossterm (re-exported as ratatui::crossterm).
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
# Terminal column widths of characters, the same table ratatui draws with.
unicode-width = "0.2"
# Regex search (Ctrl+R / -e). Default features: Unicode support and the fast matching engines.
regex = "1.13"

[profile.release]
lto = true
codegen-units = 1
strip = true
